<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>やることリスト</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap">
<style>
:root {
  --accent: #6366f1;
  --accent-hover: #4f46e5;
  --accent-soft: rgba(99,102,241,.07);
  --accent-glow: rgba(99,102,241,.15);
  --bg: #f5f5f7;
  --card: #ffffff;
  --ink: #1e293b;
  --sub: #64748b;
  --muted: #94a3b8;
  --line: #e2e8f0;
  --line-soft: #f1f5f9;
  --done-text: #cbd5e1;
  --high: #ef4444;
  --high-soft: rgba(239,68,68,.06);
  --warn: #f59e0b;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.04), 0 1px 2px rgba(0,0,0,.03);
  --shadow-md: 0 4px 16px rgba(0,0,0,.06), 0 1px 3px rgba(0,0,0,.04);
  --shadow-lg: 0 12px 40px rgba(0,0,0,.1);
  --radius: 14px;
  --radius-sm: 10px;
  --font: 'Noto Sans JP', system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1117; --card: #1a1d27; --ink: #e2e5ef; --sub: #8a8fa3;
    --muted: #5e6275; --line: #2a2e3a; --line-soft: #1f2230;
    --accent-soft: rgba(99,102,241,.12); --accent-glow: rgba(99,102,241,.2);
    --high-soft: rgba(239,68,68,.12); --done-text: #3e4250;
    --shadow-sm: 0 1px 3px rgba(0,0,0,.2);
    --shadow-md: 0 4px 16px rgba(0,0,0,.25);
    --shadow-lg: 0 12px 40px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font); background: var(--bg); color: var(--ink);
  min-height: 100dvh; -webkit-font-smoothing: antialiased;
}

/* ===== Header ===== */
.header {
  background: linear-gradient(135deg, #4f46e5 0%, #6366f1 50%, #818cf8 100%);
  color: #fff; padding: 20px 20px 48px; text-align: center;
}
.header h1 { font-size: 20px; font-weight: 700; letter-spacing: .02em; }
.header p { font-size: 12px; opacity: .8; margin-top: 4px; }

/* ===== Main Container ===== */
.container {
  max-width: 480px; margin: -32px auto 0; padding: 0 16px 100px;
  position: relative;
}

/* ===== Add Form ===== */
.add-area {
  background: var(--card); border-radius: var(--radius); padding: 14px;
  box-shadow: var(--shadow-md); margin-bottom: 20px;
  border: 1px solid var(--line);
}
.add-row { display: flex; gap: 8px; }
.add-input {
  flex: 1; padding: 12px 14px; border: 1.5px solid var(--line);
  border-radius: var(--radius-sm); font-size: 15px; font-family: var(--font);
  background: var(--bg); color: var(--ink);
  transition: border-color .2s, box-shadow .2s;
}
.add-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
.add-input::placeholder { color: var(--muted); }
.add-btn {
  padding: 12px 18px; border: none; border-radius: var(--radius-sm);
  background: linear-gradient(135deg, #4f46e5, #6366f1);
  color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
  font-family: var(--font); transition: all .15s;
  box-shadow: 0 2px 8px rgba(99,102,241,.25);
  white-space: nowrap;
}
.add-btn:hover { box-shadow: 0 4px 16px rgba(99,102,241,.35); transform: translateY(-1px); }
.add-btn:active { transform: scale(.97); }

/* ===== Filter ===== */
.filter-bar {
  display: flex; gap: 4px; margin-bottom: 14px;
  background: var(--card); border-radius: var(--radius-sm);
  padding: 4px; border: 1px solid var(--line);
}
.filter-btn {
  flex: 1; padding: 7px 0; border: none; border-radius: 8px;
  background: transparent; font-size: 12px; font-weight: 500;
  cursor: pointer; font-family: var(--font); color: var(--sub);
  transition: all .2s;
}
.filter-btn:hover { background: var(--line-soft); }
.filter-btn.active { background: var(--accent); color: #fff; box-shadow: var(--shadow-sm); }
.filter-btn .badge {
  display: inline-block; min-width: 18px; height: 18px;
  background: rgba(255,255,255,.2); border-radius: 9px;
  font-size: 10px; font-weight: 700; line-height: 18px;
  text-align: center; margin-left: 4px; padding: 0 4px;
}
.filter-btn:not(.active) .badge { background: var(--line-soft); color: var(--sub); }

/* ===== Todo Items ===== */
.todo-list { display: flex; flex-direction: column; gap: 6px; }
.todo-item {
  background: var(--card); border-radius: var(--radius-sm); padding: 12px 14px;
  display: flex; align-items: center; gap: 12px;
  border: 1px solid var(--line); box-shadow: var(--shadow-sm);
  transition: all .2s ease;
  animation: slideIn .25s cubic-bezier(.16,1,.3,1);
}
@keyframes slideIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
.todo-item:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
.todo-item.done { opacity: .55; }
.todo-item.done:hover { opacity: .7; }

.chk {
  width: 22px; height: 22px; min-width: 22px; border-radius: 7px;
  border: 2px solid var(--accent); background: transparent;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 12px; color: transparent; transition: all .2s;
}
.chk:hover { background: var(--accent-soft); transform: scale(1.1); }
.chk.checked {
  background: var(--accent); border-color: var(--accent); color: #fff;
  animation: checkPop .3s cubic-bezier(.16,1,.3,1);
}
@keyframes checkPop { 0% { transform: scale(.8); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }

.todo-text {
  flex: 1; min-width: 0; font-size: 14px; font-weight: 500;
  line-height: 1.5; word-break: break-word; cursor: text;
}
.todo-text.done { text-decoration: line-through; color: var(--done-text); font-weight: 400; }

.todo-date { font-size: 10px; color: var(--muted); white-space: nowrap; }
.todo-del {
  border: none; background: none; cursor: pointer; font-size: 16px;
  color: var(--muted); opacity: 0; padding: 4px; border-radius: 6px;
  transition: all .15s;
}
.todo-item:hover .todo-del { opacity: .5; }
.todo-del:hover { opacity: 1 !important; color: var(--high); background: var(--high-soft); }

/* ===== Empty ===== */
.empty {
  text-align: center; padding: 48px 20px; color: var(--muted);
  font-size: 14px; line-height: 2;
}
.empty-icon { font-size: 40px; margin-bottom: 8px; }

/* ===== Progress ===== */
.progress-area {
  background: var(--card); border-radius: var(--radius-sm);
  padding: 14px 16px; margin-bottom: 14px;
  border: 1px solid var(--line); box-shadow: var(--shadow-sm);
}
.progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.progress-label { font-size: 12px; font-weight: 600; color: var(--sub); }
.progress-pct { font-size: 20px; font-weight: 700; color: var(--accent); }
.progress-bar {
  height: 8px; background: var(--line-soft); border-radius: 4px; overflow: hidden;
}
.progress-fill {
  height: 100%; background: linear-gradient(90deg, #4f46e5, #818cf8);
  border-radius: 4px; transition: width .4s cubic-bezier(.16,1,.3,1);
}

/* ===== Footer ===== */
.footer {
  text-align: center; padding: 20px; font-size: 11px; color: var(--muted); line-height: 1.7;
}
.footer a {
  color: var(--accent); text-decoration: none; font-weight: 600;
}

/* ===== Toast ===== */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--ink); color: var(--bg); padding: 12px 24px; border-radius: 12px;
  font-size: 14px; font-weight: 500; z-index: 999;
  box-shadow: var(--shadow-lg); animation: toastAnim 2.5s ease forwards;
}
@keyframes toastAnim {
  0% { opacity:0; transform: translateX(-50%) translateY(12px); }
  8% { opacity:1; transform: translateX(-50%) translateY(0); }
  80% { opacity:1; } 100% { opacity:0; }
}
</style>
</head>
<body>

<div class="header">
  <h1>✅ やることリスト</h1>
  <p id="dateLabel"></p>
</div>

<div class="container">
  <!-- Add -->
  <div class="add-area">
    <div class="add-row">
      <input class="add-input" id="addInput" placeholder="やることを入力…" maxlength="100">
      <button class="add-btn" onclick="addTodo()">追加</button>
    </div>
  </div>

  <!-- Progress -->
  <div class="progress-area" id="progressArea">
    <div class="progress-header">
      <span class="progress-label">今日の進捗</span>
      <span class="progress-pct" id="progressPct">0%</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  </div>

  <!-- Filter -->
  <div class="filter-bar">
    <button class="filter-btn active" id="fAll" onclick="setFilter('all')">すべて<span class="badge" id="bAll">0</span></button>
    <button class="filter-btn" id="fOpen" onclick="setFilter('open')">未完了<span class="badge" id="bOpen">0</span></button>
    <button class="filter-btn" id="fDone" onclick="setFilter('done')">完了<span class="badge" id="bDone">0</span></button>
  </div>

  <!-- List -->
  <div class="todo-list" id="todoList"></div>

  <!-- Footer -->
  <div class="footer">
    やることリスト — Free Edition<br>
    もっと高機能な業務テンプレートは<br>
    <a href="https://note.com/" target="_blank" rel="noopener">オートメ屋のnoteショップ</a>で公開中<!-- ★差し替え：noteショップURL -->
  </div>
</div>

<script>
const KEY = 'todo_items';
const LS = {
  get(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

let items = LS.get(KEY) || [];
let filter = 'all';

function todayStr() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function fmtDate(s) { if (!s) return ''; const p = s.split('-'); return parseInt(p[1]) + '/' + parseInt(p[2]); }
function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function toast(msg) {
  document.querySelectorAll('.toast').forEach(e => e.remove());
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el); setTimeout(() => el.parentNode && el.remove(), 2500);
}
function save() { LS.set(KEY, items); }

/* ===== Add ===== */
function addTodo() {
  const inp = document.getElementById('addInput');
  const text = inp.value.trim(); if (!text) return;
  items.unshift({ id: Date.now(), text, done: false, created: todayStr() });
  save(); inp.value = ''; render();
  inp.focus();
}
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.activeElement?.id === 'addInput') addTodo();
});

/* ===== Toggle / Delete ===== */
function toggle(id) {
  items = items.map(i => i.id === id ? { ...i, done: !i.done, doneAt: !i.done ? todayStr() : undefined } : i);
  save(); render();
}
function del(id) {
  items = items.filter(i => i.id !== id);
  save(); render();
}

/* ===== Filter ===== */
function setFilter(f) {
  filter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.id === 'f' + f.charAt(0).toUpperCase() + f.slice(1)));
  render();
}

/* ===== Render ===== */
function render() {
  const total = items.length, doneCount = items.filter(i => i.done).length, openCount = total - doneCount;
  const pct = total ? Math.round(doneCount / total * 100) : 0;

  document.getElementById('progressPct').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressArea').style.display = total ? '' : 'none';

  document.getElementById('bAll').textContent = total;
  document.getElementById('bOpen').textContent = openCount;
  document.getElementById('bDone').textContent = doneCount;

  const filtered = filter === 'open' ? items.filter(i => !i.done) : filter === 'done' ? items.filter(i => i.done) : items;
  const list = document.getElementById('todoList');

  if (!filtered.length) {
    const msgs = {
      all: { icon: '📝', text: 'やることを追加してみましょう' },
      open: { icon: '🎉', text: 'すべて完了しました！' },
      done: { icon: '💪', text: 'まだ完了したタスクはありません' }
    };
    const m = msgs[filter];
    list.innerHTML = '<div class="empty"><div class="empty-icon">' + m.icon + '</div>' + m.text + '</div>';
    return;
  }

  list.innerHTML = filtered.map(it =>
    '<div class="todo-item' + (it.done ? ' done' : '') + '">' +
    '<button class="chk' + (it.done ? ' checked' : '') + '" onclick="toggle(' + it.id + ')">' + (it.done ? '✓' : '') + '</button>' +
    '<span class="todo-text' + (it.done ? ' done' : '') + '">' + esc(it.text) + '</span>' +
    '<span class="todo-date">' + fmtDate(it.created) + '</span>' +
    '<button class="todo-del" onclick="del(' + it.id + ')">×</button>' +
    '</div>'
  ).join('');
}

/* ===== Init ===== */
document.getElementById('dateLabel').textContent = (() => {
  const d = new Date(), w = ['日','月','火','水','木','金','土'][d.getDay()];
  return d.getFullYear() + '年' + (d.getMonth()+1) + '月' + d.getDate() + '日（' + w + '）';
})();
render();
document.getElementById('addInput').focus();
</script>
</body>
</html>

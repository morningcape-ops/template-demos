<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>タスクマネージャー</title>
<style>
/* ★差し替え：アプリ名・カラー */
:root {
  --accent: #059669;
  --accent-light: #d1fae5;
  --accent-dark: #047857;
  --bg: #f8faf8;
  --card: #ffffff;
  --ink: #1a1a1a;
  --sub: #6b7280;
  --line: #e5e7eb;
  --high: #dc2626;
  --high-bg: #fef2f2;
  --mid: #059669;
  --low: #6b7280;
  --done: #9ca3af;
  --memo-yellow: #fffde7;
  --font: system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111916; --card: #1a2620; --ink: #e8ede9; --sub: #8a9b8f;
    --line: #2d3d33; --accent-light: #1a3a2a; --high-bg: #2a1a1a;
    --memo-yellow: #3a3520;
    color-scheme: dark;
  }
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font); background: var(--bg); color: var(--ink);
  min-height: 100dvh; padding-bottom: 80px;
}
.header {
  position: sticky; top: 0; z-index: 50;
  background: var(--accent); color: #fff; padding: 14px 16px;
  display: flex; align-items: center; justify-content: space-between;
}
.header h1 { font-size: 17px; font-weight: 700; }
.header-right { display: flex; gap: 8px; align-items: center; }
.header-btn {
  background: rgba(255,255,255,.18); border: none; color: #fff;
  padding: 6px 10px; border-radius: 8px; font-size: 13px; cursor: pointer;
  font-family: var(--font);
}
.header-btn:hover { background: rgba(255,255,255,.28); }

/* Tabs */
.tabs {
  display: flex; background: var(--card); border-bottom: 1px solid var(--line);
  position: sticky; top: 49px; z-index: 40;
}
.tab {
  flex: 1; padding: 12px 0; text-align: center; font-size: 14px; font-weight: 500;
  color: var(--sub); border: none; background: none; cursor: pointer;
  border-bottom: 2px solid transparent; font-family: var(--font);
  transition: color .15s, border-color .15s;
}
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

/* Tab panels */
.panel { display: none; padding: 12px 16px; }
.panel.active { display: block; }

/* Cards */
.card {
  background: var(--card); border-radius: 12px; padding: 14px;
  margin-bottom: 10px; border: 1px solid var(--line);
}

/* Task items */
.task-section { margin-bottom: 16px; }
.sec-header {
  display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
  font-size: 13px; font-weight: 600; color: var(--sub);
}
.sec-dot { width: 10px; height: 10px; border-radius: 50%; }
.sec-count { font-weight: 400; font-size: 12px; }
.task-card {
  background: var(--card); border-radius: 10px; padding: 12px;
  margin-bottom: 8px; border: 1px solid var(--line);
  border-left: 3px solid var(--mid);
  transition: box-shadow .15s;
}
.task-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,.06); }
.task-card.priority-high { border-left-color: var(--high); }
.task-card.priority-low { border-left-color: var(--low); }
.task-card.overdue { background: var(--high-bg); }
.task-main {
  display: flex; align-items: flex-start; gap: 10px;
}
.chk {
  width: 22px; height: 22px; min-width: 22px; border-radius: 6px;
  border: 2px solid var(--accent); background: transparent;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 13px; color: #fff; margin-top: 1px;
  transition: background .15s;
}
.chk.checked { background: var(--done); border-color: var(--done); }
.task-body { flex: 1; min-width: 0; }
.task-title { font-size: 14px; line-height: 1.5; word-break: break-word; }
.task-title.done-text { text-decoration: line-through; color: var(--done); }
.task-meta {
  display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px;
  font-size: 11px; color: var(--sub);
}
.task-meta span { display: flex; align-items: center; gap: 2px; }
.pri-badge {
  font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 4px;
  color: #fff;
}
.pri-badge.high { background: var(--high); }
.pri-badge.mid { background: var(--mid); }
.pri-badge.low { background: var(--low); }
.task-actions { display: flex; gap: 2px; margin-left: 4px; }
.icon-btn {
  border: none; background: none; cursor: pointer; font-size: 16px;
  padding: 4px; color: var(--sub); opacity: .6;
}
.icon-btn:hover { opacity: 1; }
.empty-msg { text-align: center; padding: 32px 16px; color: var(--sub); font-size: 14px; line-height: 1.8; }

/* Remarks panel */
.remarks-toggle {
  border: none; background: none; cursor: pointer; font-size: 15px;
  padding: 4px; position: relative;
}
.remarks-badge {
  position: absolute; top: -2px; right: -4px;
  background: var(--accent); color: #fff; font-size: 9px;
  min-width: 15px; height: 15px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
}
.remarks-area {
  background: var(--accent-light); border-radius: 0 0 10px 10px;
  padding: 10px 12px; margin-top: 8px;
}
.remark-row {
  display: flex; align-items: flex-start; gap: 6px; padding: 4px 0;
  font-size: 13px;
}
.remark-chk {
  width: 16px; height: 16px; min-width: 16px; border-radius: 4px;
  border: 1.5px solid var(--accent); background: transparent;
  cursor: pointer; font-size: 10px; color: #fff;
  display: flex; align-items: center; justify-content: center;
}
.remark-chk.checked { background: var(--done); border-color: var(--done); }
.remark-text { flex: 1; min-width: 0; line-height: 1.4; }
.remark-text.done { text-decoration: line-through; color: var(--done); }
.remark-del {
  border: none; background: none; cursor: pointer; color: var(--sub);
  font-size: 14px; opacity: .5; padding: 0 2px;
}
.remark-del:hover { opacity: 1; color: var(--high); }
.remark-add {
  display: flex; gap: 6px; margin-top: 8px;
}
.remark-add input {
  flex: 1; padding: 7px 10px; border: 1px solid var(--line);
  border-radius: 7px; font-size: 13px; font-family: var(--font);
  background: var(--card); color: var(--ink);
}
.remark-add button {
  padding: 7px 12px; border: none; background: var(--accent);
  color: #fff; border-radius: 7px; font-size: 13px; cursor: pointer;
  font-family: var(--font);
}

/* Memo panel */
.memo-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.memo-card {
  width: calc(50% - 4px); min-height: 80px; border-radius: 8px;
  padding: 10px; position: relative; font-size: 13px;
  border: 1px solid rgba(0,0,0,.06);
}
@media (max-width: 500px) { .memo-card { width: 100%; } }
.memo-card .mdel {
  position: absolute; top: 4px; right: 6px;
  border: none; background: none; cursor: pointer;
  font-size: 16px; opacity: .3; color: var(--ink);
}
.memo-card .mdel:hover { opacity: .8; }
.memo-card .mchk {
  width: 16px; height: 16px; min-width: 16px; border-radius: 4px;
  border: 1.5px solid #999; background: transparent; cursor: pointer;
  font-size: 10px; color: #fff;
  display: flex; align-items: center; justify-content: center;
}
.memo-card .mchk.checked { background: var(--done); border-color: var(--done); }
.memo-top { display: flex; align-items: flex-start; gap: 6px; }
.memo-text {
  flex: 1; min-width: 0; line-height: 1.5; word-break: break-word; cursor: pointer;
}
.memo-text.done { text-decoration: line-through; color: var(--done); }
.memo-date { font-size: 10px; color: var(--sub); margin-top: 6px; }
.memo-input-area { margin-top: 12px; }
.memo-input-area textarea {
  width: 100%; padding: 10px; border: 1px solid var(--line);
  border-radius: 8px; font-size: 14px; font-family: var(--font);
  resize: vertical; min-height: 60px; background: var(--card); color: var(--ink);
}
.color-presets { display: flex; gap: 6px; margin: 8px 0; flex-wrap: wrap; }
.color-preset {
  width: 22px; height: 22px; border-radius: 5px; border: 2px solid var(--line);
  cursor: pointer; padding: 0;
}
.color-preset.selected { border-color: var(--accent); }
.memo-input-area .btn-row { display: flex; gap: 8px; margin-top: 8px; }

/* Work log panel */
.wl-item {
  background: var(--card); border-radius: 10px; padding: 12px;
  margin-bottom: 8px; border: 1px solid var(--line);
}
.wl-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.wl-datetime { font-size: 12px; color: var(--accent); font-weight: 600; }
.wl-actions { display: flex; gap: 4px; }
.wl-btn {
  border: none; background: none; cursor: pointer; font-size: 14px;
  color: var(--sub); opacity: .5; padding: 2px 4px;
}
.wl-btn:hover { opacity: 1; }
.wl-content { font-size: 14px; line-height: 1.5; }
.wl-notes { font-size: 12px; color: var(--sub); margin-top: 4px; }
.wl-form {
  display: none; background: var(--card); border-radius: 12px;
  padding: 16px; margin-bottom: 12px; border: 1px solid var(--line);
}
.wl-form.open { display: block; }
.wl-form .field { margin-bottom: 10px; }
.wl-form label { display: block; font-size: 12px; font-weight: 600; color: var(--sub); margin-bottom: 4px; }
.wl-form input, .wl-form textarea {
  width: 100%; padding: 10px; border: 1px solid var(--line);
  border-radius: 8px; font-size: 14px; font-family: var(--font);
  background: var(--card); color: var(--ink);
}
.wl-form textarea { resize: vertical; min-height: 60px; }

/* Sort toggle */
.sort-toggle {
  display: flex; gap: 6px; align-items: center; margin-bottom: 12px;
  font-size: 12px; color: var(--sub);
}
.sort-btn {
  padding: 4px 10px; border: 1px solid var(--line); border-radius: 6px;
  background: transparent; font-size: 12px; cursor: pointer;
  font-family: var(--font); color: var(--sub);
}
.sort-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

/* FAB */
.fab {
  position: fixed; bottom: 24px; right: 20px;
  width: 56px; height: 56px; border-radius: 50%;
  background: var(--accent); color: #fff; border: none;
  font-size: 28px; cursor: pointer; z-index: 100;
  box-shadow: 0 4px 12px rgba(5,150,105,.3);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font);
}
.fab:hover { background: var(--accent-dark); }

/* Overlay / Form sheet */
.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.4);
  z-index: 200; display: flex; align-items: flex-end; justify-content: center;
}
.sheet {
  background: var(--card); border-radius: 20px 20px 0 0;
  padding: 24px 20px 32px; width: 100%; max-width: 520px;
  max-height: 90vh; overflow-y: auto;
}
.sheet h2 { font-size: 18px; margin-bottom: 16px; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12px; font-weight: 600; color: var(--sub); margin-bottom: 4px; }
.field input, .field select, .field textarea {
  width: 100%; padding: 11px 12px; font-size: 15px; color: var(--ink);
  border: 1px solid var(--line); border-radius: 9px; background: var(--card);
  outline: none; font-family: var(--font);
}
.field select { appearance: auto; }
.twocol { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.form-actions {
  display: flex; gap: 10px; margin-top: 18px;
}
.btn-save {
  flex: 1; padding: 13px; border: none; background: var(--accent);
  color: #fff; border-radius: 10px; font-size: 15px; font-weight: 600;
  cursor: pointer; font-family: var(--font);
}
.btn-cancel {
  padding: 13px 20px; border: 1px solid var(--line); background: transparent;
  border-radius: 10px; color: var(--sub); font-size: 14px; cursor: pointer;
  font-family: var(--font);
}

/* Complete dialog */
.complete-sheet { max-width: 480px; text-align: center; }
.complete-sheet .cmp-btns { display: flex; flex-direction: column; gap: 9px; }
.cmp-btn {
  padding: 13px; border-radius: 10px; font-size: 15px; font-weight: 600;
  cursor: pointer; font-family: var(--font);
}

/* Settings panel */
.setting-section { margin-bottom: 20px; }
.setting-section h3 { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
.data-stat {
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 16px;
}
.stat-card {
  background: var(--accent-light); border-radius: 10px; padding: 12px; text-align: center;
}
.stat-num { font-size: 24px; font-weight: 700; color: var(--accent); }
.stat-label { font-size: 11px; color: var(--sub); margin-top: 2px; }
.setting-btn {
  display: block; width: 100%; padding: 12px; border: 1px solid var(--line);
  border-radius: 10px; background: var(--card); font-size: 14px;
  cursor: pointer; font-family: var(--font); color: var(--ink);
  text-align: left; margin-bottom: 8px;
}
.setting-btn:hover { background: var(--accent-light); }
.setting-btn.danger { color: var(--high); border-color: #fecaca; }
.setting-btn.danger:hover { background: var(--high-bg); }

/* Toast */
.toast {
  position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
  background: #333; color: #fff; padding: 10px 20px; border-radius: 10px;
  font-size: 14px; z-index: 999; animation: fadeInOut 2.8s ease;
}
@keyframes fadeInOut { 0%{opacity:0;transform:translateX(-50%) translateY(10px)} 10%{opacity:1;transform:translateX(-50%) translateY(0)} 85%{opacity:1} 100%{opacity:0} }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <h1>📋 タスクマネージャー</h1><!-- ★差し替え：アプリ名 -->
  <div class="header-right">
    <span id="dateLabel" style="font-size:12px;opacity:.8"></span>
  </div>
</div>

<!-- Tabs -->
<div class="tabs">
  <button class="tab active" data-tab="tasks" onclick="switchTab('tasks')">タスク</button>
  <button class="tab" data-tab="log" onclick="switchTab('log')">業務記録</button>
  <button class="tab" data-tab="memo" onclick="switchTab('memo')">メモ</button>
  <button class="tab" data-tab="settings" onclick="switchTab('settings')">設定</button>
</div>

<!-- Task panel -->
<div id="panelTasks" class="panel active">
  <div class="sort-toggle">
    並び順：
    <button class="sort-btn active" id="sortCreated" onclick="setSort('created')">作成順</button>
    <button class="sort-btn" id="sortUpdated" onclick="setSort('updated')">更新順</button>
  </div>
  <div id="taskWrap"></div>
</div>

<!-- Work log panel -->
<div id="panelLog" class="panel">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
    <h2 style="font-size:16px;">業務記録</h2>
    <button class="header-btn" style="background:var(--accent);font-size:13px;" onclick="showWlForm()">＋ 記録</button>
  </div>
  <div id="wlForm" class="wl-form">
    <div class="twocol">
      <div class="field"><label>日付</label><input type="date" id="wf_date"></div>
      <div class="field"><label>時刻</label><input type="time" id="wf_time"></div>
    </div>
    <div class="field"><label>作業内容</label><textarea id="wf_content" placeholder="作業内容を入力…"></textarea></div>
    <div class="field"><label>備考</label><input id="wf_notes" placeholder="補足情報（任意）"></div>
    <div class="form-actions">
      <button class="btn-cancel" onclick="hideWlForm()">キャンセル</button>
      <button class="btn-save" onclick="saveWorklog()">保存</button>
    </div>
  </div>
  <div id="wlList"></div>
</div>

<!-- Memo panel -->
<div id="panelMemo" class="panel">
  <h2 style="font-size:16px;margin-bottom:12px;">📌 メモ</h2>
  <div id="memoGrid" class="memo-grid"></div>
  <div class="memo-input-area">
    <textarea id="memoInput" placeholder="メモを入力…（付箋のように使えます）"></textarea>
    <div class="color-presets" id="colorPresets"></div>
    <div class="btn-row">
      <button class="btn-save" style="flex:1" onclick="addMemo()">メモを追加</button>
      <button class="btn-cancel" onclick="clearDoneMemos()">完了を削除</button>
    </div>
  </div>
</div>

<!-- Settings panel -->
<div id="panelSettings" class="panel">
  <h2 style="font-size:16px;margin-bottom:16px;">⚙️ 設定</h2>
  <div class="setting-section">
    <h3>データ件数</h3>
    <div class="data-stat">
      <div class="stat-card"><div class="stat-num" id="statTasks">0</div><div class="stat-label">タスク</div></div>
      <div class="stat-card"><div class="stat-num" id="statLogs">0</div><div class="stat-label">業務記録</div></div>
      <div class="stat-card"><div class="stat-num" id="statMemos">0</div><div class="stat-label">メモ</div></div>
    </div>
  </div>
  <div class="setting-section">
    <h3>エクスポート</h3>
    <button class="setting-btn" onclick="exportJSON()">📦 全データをJSON保存</button>
    <button class="setting-btn" onclick="exportCSV()">📊 タスク一覧をCSV出力</button>
  </div>
  <div class="setting-section">
    <h3>インポート</h3>
    <button class="setting-btn" onclick="document.getElementById('importFile').click()">📂 JSONファイルから復元</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importJSON(this)">
  </div>
  <div class="setting-section">
    <h3>データ管理</h3>
    <button class="setting-btn danger" onclick="clearAll()">🗑️ 全データを削除</button>
  </div>
  <div style="text-align:center;margin-top:24px;font-size:11px;color:var(--sub);">
    タスクマネージャー v1.0<br><!-- ★差し替え：バージョン表記 -->
    データはブラウザのローカルストレージに保存されます
  </div>
</div>

<!-- FAB -->
<button class="fab" id="fab" onclick="fabAction()">＋</button>

<script>
/* ===== ★差し替え：初期テンプレート ===== */
const APP_PREFIX = 'tm_';
const PRI_LABEL = { high: '高', mid: '中', low: '低' };
const MEMO_COLORS = ['#fffde7','#e8f5e9','#e3f2fd','#fce4ec','#f3e5f5','#fff3e0','#e0f7fa','#f5f5f5'];
const SEED = [
  { id: 1, content: '週次レポート作成', requester: '', assignee: '', due: '', priority: 'high', done: false, remarks: [] },
  { id: 2, content: '備品発注（コピー用紙・トナー）', requester: '', assignee: '', due: '', priority: 'mid', done: false, remarks: [] },
  { id: 3, content: '会議室予約の確認', requester: '', assignee: '', due: '', priority: 'low', done: false, remarks: [] },
];

/* ===== Storage ===== */
const LS = {
  get(k) { try { const v = localStorage.getItem(APP_PREFIX + k); return v ? JSON.parse(v) : null; } catch { return null; } },
  set(k, v) { try { localStorage.setItem(APP_PREFIX + k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(APP_PREFIX + k); } catch {} }
};

/* ===== State ===== */
let items = LS.get('items') || SEED.map(i => ({ ...i, id: Date.now() + Math.random(), createdAt: nowFull(), remarks: [] }));
let workLogs = LS.get('worklogs') || [];
let memos = LS.get('memos') || [];
let sortMode = LS.get('sort') || 'created';
let editId = null;
let editWlId = null;
let editingMemoId = null;
let memoColor = MEMO_COLORS[0];
let openRemarks = new Set();

/* ===== Utils ===== */
function todayStr() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function nowTimeStr() { const d = new Date(); return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }
function nowFull() { return todayStr() + ' ' + nowTimeStr() + ':' + String(new Date().getSeconds()).padStart(2,'0'); }
function daysUntil(due) { if (!due) return null; return Math.round((new Date(due+'T00:00:00') - new Date(todayStr()+'T00:00:00')) / 86400000); }
function fmtDue(due) {
  if (!due) return '期限なし';
  const n = daysUntil(due), p = due.split('-'), base = parseInt(p[1]) + '/' + parseInt(p[2]);
  if (n === 0) return base + '（今日）';
  if (n === 1) return base + '（明日）';
  if (n < 0) return base + '（' + Math.abs(n) + '日超過）';
  return base + '（あと' + n + '日）';
}
function fmtDate(s) { if (!s) return ''; const p = s.split('-'); return parseInt(p[1]) + '/' + parseInt(p[2]); }
function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(msg) {
  document.querySelectorAll('.toast').forEach(e => e.remove());
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => { if (el.parentNode) el.remove(); }, 2800);
}
function save() { LS.set('items', items); LS.set('worklogs', workLogs); LS.set('memos', memos); LS.set('sort', sortMode); }

/* ===== Tab switching ===== */
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  const panelMap = { tasks: 'panelTasks', log: 'panelLog', memo: 'panelMemo', settings: 'panelSettings' };
  const panel = document.getElementById(panelMap[tab]);
  if (panel) panel.classList.add('active');
  if (tab === 'settings') updateStats();
}

/* ===== FAB ===== */
function fabAction() {
  const activeTab = document.querySelector('.tab.active')?.dataset.tab || 'tasks';
  if (activeTab === 'tasks') openForm();
  else if (activeTab === 'log') showWlForm();
  else if (activeTab === 'memo') { document.getElementById('memoInput')?.focus(); }
}

/* ===== SORT ===== */
function setSort(mode) {
  sortMode = mode; save();
  document.getElementById('sortCreated').classList.toggle('active', mode === 'created');
  document.getElementById('sortUpdated').classList.toggle('active', mode === 'updated');
  renderTasks();
}

/* ===== TASK RENDER ===== */
function tsCreated(it) { const s = it.createdAt || it.created; if (s) { const t = Date.parse(s.replace(' ','T')); if (!isNaN(t)) return t; } return typeof it.id === 'number' ? it.id : 0; }
function tsUpdated(it) { let best = tsCreated(it); [it.updatedAt, it.doneAt].forEach(s => { if (s) { const t = Date.parse(String(s).replace(' ','T')); if (!isNaN(t) && t > best) best = t; } }); return best; }

function renderTasks() {
  const active = items.filter(i => !i.done), done = items.filter(i => i.done);
  const sorter = (a, b) => sortMode === 'created' ? tsCreated(a) - tsCreated(b) : tsUpdated(b) - tsUpdated(a);
  const high = active.filter(i => (i.priority||'mid') === 'high').sort(sorter);
  const mid = active.filter(i => (i.priority||'mid') === 'mid').sort(sorter);
  const low = active.filter(i => (i.priority||'mid') === 'low').sort(sorter);
  const wrap = document.getElementById('taskWrap');

  if (!active.length && !done.length) {
    wrap.innerHTML = '<div class="empty-msg">まだタスクはありません。<br>右下の「＋」から追加してください。</div>';
    return;
  }

  let html = '';
  html += taskSection('優先度：高', 'var(--high)', high);
  html += taskSection('優先度：中', 'var(--mid)', mid);
  html += taskSection('優先度：低', 'var(--low)', low);
  if (done.length) html += taskSection('完了', 'var(--done)', done.sort(sorter), true);
  wrap.innerHTML = html;
}

function taskSection(title, color, list, muted) {
  if (!list.length) return '';
  let h = '<div class="task-section"><div class="sec-header">';
  h += '<span class="sec-dot" style="background:' + color + '"></span>';
  h += '<span>' + title + '</span>';
  h += '<span class="sec-count">（' + list.length + '）</span>';
  h += '</div>';
  list.forEach(it => {
    const pri = it.priority || 'mid';
    const ov = !it.done && it.due && daysUntil(it.due) <= 0;
    h += '<div class="task-card priority-' + pri + (ov ? ' overdue' : '') + '">';
    h += '<div class="task-main">';
    h += '<button class="chk' + (it.done ? ' checked' : '') + '" onclick="toggleTask(\'' + it.id + '\')">' + (it.done ? '✓' : '') + '</button>';
    h += '<div class="task-body">';
    h += '<div class="task-title' + (it.done ? ' done-text' : '') + '">' + esc(it.content) + '</div>';
    h += '<div class="task-meta">';
    if (!muted) h += '<span class="pri-badge ' + pri + '">' + PRI_LABEL[pri] + '</span>';
    if (it.due) h += '<span style="color:' + (ov ? 'var(--high)' : 'var(--sub)') + ';font-weight:' + (ov ? '700' : '400') + '">🕒 ' + fmtDue(it.due) + '</span>';
    if (it.requester) h += '<span>依頼：' + esc(it.requester) + '</span>';
    if (it.assignee) h += '<span>担当：' + esc(it.assignee) + '</span>';
    h += '</div></div>';
    h += '<div class="task-actions">';
    const rmk = (it.remarks || []).length;
    h += '<button class="remarks-toggle" onclick="toggleRemarks(\'' + it.id + '\')">📝' + (rmk ? '<span class="remarks-badge">' + rmk + '</span>' : '') + '</button>';
    h += '<button class="icon-btn" onclick="openEdit(\'' + it.id + '\')">✎</button>';
    h += '<button class="icon-btn" onclick="removeTask(\'' + it.id + '\')">×</button>';
    h += '</div></div>';
    if (openRemarks.has(it.id)) h += renderRemarks(it);
    h += '</div>';
  });
  h += '</div>';
  return h;
}

function renderRemarks(it) {
  const rem = it.remarks || [];
  let h = '<div class="remarks-area">';
  if (!rem.length) h += '<div style="font-size:12px;color:var(--sub);padding:2px 0 6px;">サブタスクを追加できます</div>';
  rem.forEach((r, idx) => {
    h += '<div class="remark-row">';
    h += '<button class="remark-chk' + (r.done ? ' checked' : '') + '" onclick="toggleRemark(\'' + it.id + '\',' + idx + ')">' + (r.done ? '✓' : '') + '</button>';
    h += '<span class="remark-text' + (r.done ? ' done' : '') + '">' + esc(r.text) + '</span>';
    h += '<button class="remark-del" onclick="deleteRemark(\'' + it.id + '\',' + idx + ')">×</button>';
    h += '</div>';
  });
  h += '<div class="remark-add">';
  h += '<input type="text" id="ri-' + it.id + '" placeholder="サブタスクを追加…" onkeydown="if(event.key===\'Enter\')addRemark(\'' + it.id + '\')">';
  h += '<button onclick="addRemark(\'' + it.id + '\')">追加</button>';
  h += '</div></div>';
  return h;
}

/* ===== TASK ACTIONS ===== */
function toggleTask(id) {
  const it = items.find(i => String(i.id) === String(id));
  if (!it) return;
  if (it.done) { items = items.map(i => String(i.id) === String(id) ? { ...i, done: false, doneAt: undefined } : i); save(); renderTasks(); return; }
  showCompleteDialog(it);
}

function showCompleteDialog(it) {
  const ov = document.createElement('div'); ov.className = 'overlay'; ov.id = 'completeOverlay';
  ov.addEventListener('click', e => { if (e.target === ov) ov.remove(); });
  ov.innerHTML = '<div class="sheet complete-sheet">' +
    '<h2 style="margin-bottom:12px;">✅ 完了にしますか？</h2>' +
    '<div style="font-size:14px;line-height:1.7;margin-bottom:6px;text-align:left;padding:0 8px;">' + esc(it.content) + '</div>' +
    '<div style="font-size:13px;color:var(--sub);margin-bottom:18px;">業務記録として残しますか？</div>' +
    '<div class="cmp-btns">' +
    '<button class="cmp-btn" style="background:var(--accent);color:#fff;border:none;" onclick="completeWithLog(\'' + it.id + '\')">📋 業務記録に残して完了</button>' +
    '<button class="cmp-btn" style="background:transparent;color:var(--sub);border:1px solid var(--line);" onclick="completeOnly(\'' + it.id + '\')">完了のみ</button>' +
    '<button class="cmp-btn" style="background:transparent;color:var(--sub);border:none;font-size:13px;" onclick="this.closest(\'.overlay\').remove()">やめる</button>' +
    '</div></div>';
  document.body.appendChild(ov);
}

function completeWithLog(id) {
  const it = items.find(i => String(i.id) === String(id));
  if (!it) return;
  const dup = workLogs.find(w => w.srcId && String(w.srcId) === String(id));
  if (!dup) {
    const notes = [it.requester ? '依頼：' + it.requester : '', it.due ? '期限：' + fmtDue(it.due) : ''].filter(Boolean).join('／');
    workLogs.push({ id: Date.now(), srcId: it.id, date: todayStr(), time: nowTimeStr(), content: it.content + (it.assignee ? ' （' + it.assignee + '）' : ''), notes, createdAt: nowFull() });
  }
  items = items.map(i => String(i.id) === String(id) ? { ...i, done: true, doneAt: nowFull() } : i);
  save(); renderTasks(); renderWorkLogs();
  document.getElementById('completeOverlay')?.remove();
  toast(dup ? '📋 既に記録済み' : '📋 業務記録に保存しました');
}

function completeOnly(id) {
  items = items.map(i => String(i.id) === String(id) ? { ...i, done: true, doneAt: nowFull() } : i);
  save(); renderTasks();
  document.getElementById('completeOverlay')?.remove();
}

function removeTask(id) {
  if (!confirm('このタスクを削除しますか？')) return;
  items = items.filter(i => String(i.id) !== String(id));
  openRemarks.delete(id);
  save(); renderTasks();
}

function toggleRemarks(id) {
  if (openRemarks.has(id)) openRemarks.delete(id);
  else openRemarks.add(id);
  renderTasks();
  if (openRemarks.has(id)) setTimeout(() => { const e = document.getElementById('ri-' + id); if (e) e.focus(); }, 40);
}

function addRemark(id) {
  const e = document.getElementById('ri-' + id); if (!e) return;
  const t = e.value.trim(); if (!t) return;
  items = items.map(i => String(i.id) !== String(id) ? i : { ...i, remarks: [...(i.remarks||[]), { text: t, done: false, createdAt: nowFull() }] });
  save(); renderTasks();
  setTimeout(() => { const e2 = document.getElementById('ri-' + id); if (e2) e2.focus(); }, 40);
}
function toggleRemark(id, idx) {
  items = items.map(i => String(i.id) !== String(id) ? i : { ...i, remarks: (i.remarks||[]).map((r,j) => j === idx ? { ...r, done: !r.done } : r) });
  save(); renderTasks();
}
function deleteRemark(id, idx) {
  items = items.map(i => String(i.id) !== String(id) ? i : { ...i, remarks: (i.remarks||[]).filter((_, j) => j !== idx) });
  save(); renderTasks();
}

/* ===== TASK FORM ===== */
function openForm() {
  const ov = document.createElement('div'); ov.className = 'overlay'; ov.id = 'formOverlay';
  ov.addEventListener('click', e => { if (e.target === ov) closeForm(); });
  const isEdit = editId != null;
  const cur = isEdit ? items.find(i => String(i.id) === String(editId)) : { content: '', requester: '', assignee: '', due: '', priority: 'mid' };
  const priOpts = ['high','mid','low'].map(p => '<option value="' + p + '"' + (cur.priority === p ? ' selected' : '') + '>' + PRI_LABEL[p] + '</option>').join('');
  ov.innerHTML = '<div class="sheet"><h2>' + (isEdit ? 'タスクを編集' : 'タスクを追加') + '</h2>' +
    '<div class="field"><label>タスク内容</label><input id="f_content" placeholder="例：週次レポートの作成" value="' + esc(cur.content) + '"></div>' +
    '<div class="twocol"><div class="field"><label>依頼者</label><input id="f_req" placeholder="例：部長" value="' + esc(cur.requester) + '"></div>' +
    '<div class="field"><label>担当</label><input id="f_asg" placeholder="例：自分" value="' + esc(cur.assignee) + '"></div></div>' +
    '<div class="twocol"><div class="field"><label>期限</label><input id="f_due" type="date" value="' + (cur.due||'') + '"></div>' +
    '<div class="field"><label>優先度</label><select id="f_pri">' + priOpts + '</select></div></div>' +
    '<div class="form-actions"><button class="btn-cancel" onclick="closeForm()">やめる</button><button class="btn-save" onclick="saveForm()">' + (isEdit ? '保存する' : '追加する') + '</button></div></div>';
  document.body.appendChild(ov);
  setTimeout(() => { document.getElementById('f_content')?.focus(); }, 50);
}
function closeForm() { document.getElementById('formOverlay')?.remove(); editId = null; }
function openEdit(id) { editId = id; openForm(); }
function saveForm() {
  const content = document.getElementById('f_content').value.trim(); if (!content) return;
  const requester = document.getElementById('f_req').value.trim();
  const assignee = document.getElementById('f_asg').value.trim();
  const due = document.getElementById('f_due').value;
  const priority = document.getElementById('f_pri').value || 'mid';
  if (editId != null) {
    items = items.map(i => String(i.id) !== String(editId) ? i : { ...i, content, requester, assignee, due, priority, updatedAt: nowFull() });
  } else {
    items.push({ id: String(Date.now()) + Math.random().toString(36).slice(2,6), content, requester, assignee, due, priority, done: false, createdAt: nowFull(), remarks: [] });
  }
  save(); closeForm(); renderTasks();
}

/* ===== MEMO ===== */
function renderMemos() {
  const grid = document.getElementById('memoGrid');
  if (!memos.length) { grid.innerHTML = '<div class="empty-msg" style="width:100%">メモはありません。<br>下の入力欄から追加できます。</div>'; return; }
  let h = '';
  memos.forEach(m => {
    const bg = m.color || MEMO_COLORS[0];
    if (editingMemoId === m.id) {
      h += '<div class="memo-card" style="background:' + bg + ';width:100%;">';
      h += '<div class="memo-top"><button class="mchk' + (m.done ? ' checked' : '') + '" onclick="toggleMemo(\'' + m.id + '\')">' + (m.done ? '✓' : '') + '</button>';
      h += '<div style="flex:1;min-width:0;"><textarea id="medit-' + m.id + '" rows="3" style="width:100%;font-size:13px;font-family:var(--font);border:1px solid var(--line);border-radius:6px;padding:6px;background:var(--card);color:var(--ink);resize:vertical;">' + esc(m.text) + '</textarea>';
      h += '<div style="display:flex;gap:4px;margin-top:4px;flex-wrap:wrap;align-items:center;">';
      MEMO_COLORS.forEach(c => { h += '<button onclick="setEditColor(\'' + m.id + '\',\'' + c + '\')" style="width:16px;height:16px;border-radius:3px;border:1.5px solid ' + (c === bg ? 'var(--accent)' : '#ccc') + ';background:' + c + ';cursor:pointer;padding:0;"></button>'; });
      h += '<button onclick="saveMemoEdit(\'' + m.id + '\')" style="margin-left:auto;font-size:11px;padding:3px 10px;border:none;background:var(--accent);color:#fff;border-radius:5px;cursor:pointer;">保存</button>';
      h += '<button onclick="cancelMemoEdit()" style="font-size:11px;padding:3px 8px;border:1px solid var(--line);background:none;border-radius:5px;cursor:pointer;">×</button>';
      h += '</div></div></div></div>';
    } else {
      h += '<div class="memo-card" style="background:' + bg + ';">';
      h += '<button class="mdel" onclick="deleteMemo(\'' + m.id + '\')">×</button>';
      h += '<div class="memo-top"><button class="mchk' + (m.done ? ' checked' : '') + '" onclick="toggleMemo(\'' + m.id + '\')">' + (m.done ? '✓' : '') + '</button>';
      h += '<div class="memo-text' + (m.done ? ' done' : '') + '" onclick="startMemoEdit(\'' + m.id + '\')" title="タップで編集">' + esc(m.text).replace(/\n/g,'<br>') + '</div></div>';
      h += '<div class="memo-date">' + (m.created ? fmtDate(m.created) : '') + '</div>';
      h += '</div>';
    }
  });
  grid.innerHTML = h;
  if (editingMemoId != null) { const e = document.getElementById('medit-' + editingMemoId); if (e) { e.focus(); e.setSelectionRange(e.value.length, e.value.length); } }
}

function addMemo() {
  const inp = document.getElementById('memoInput'); if (!inp) return;
  const text = inp.value.trim(); if (!text) return;
  memos.unshift({ id: String(Date.now()) + Math.random().toString(36).slice(2,6), text, done: false, color: memoColor, created: todayStr(), createdAt: nowFull() });
  save(); inp.value = ''; renderMemos();
  setTimeout(() => { document.getElementById('memoInput')?.focus(); }, 30);
}
function toggleMemo(id) { memos = memos.map(m => String(m.id) === String(id) ? { ...m, done: !m.done } : m); save(); renderMemos(); }
function deleteMemo(id) { memos = memos.filter(m => String(m.id) !== String(id)); if (String(editingMemoId) === String(id)) editingMemoId = null; save(); renderMemos(); }
function startMemoEdit(id) { editingMemoId = id; renderMemos(); }
function cancelMemoEdit() { editingMemoId = null; renderMemos(); }
function saveMemoEdit(id) {
  const e = document.getElementById('medit-' + id); if (!e) return;
  const t = e.value.trim(); if (!t) { cancelMemoEdit(); return; }
  memos = memos.map(m => String(m.id) === String(id) ? { ...m, text: t, updatedAt: nowFull() } : m);
  editingMemoId = null; save(); renderMemos();
}
function setEditColor(id, color) { memos = memos.map(m => String(m.id) === String(id) ? { ...m, color } : m); save(); renderMemos(); }
function clearDoneMemos() {
  const cnt = memos.filter(m => m.done).length;
  if (!cnt) { toast('完了済みメモはありません'); return; }
  if (!confirm(cnt + '件の完了済みメモを削除しますか？')) return;
  memos = memos.filter(m => !m.done); save(); renderMemos();
}

function initColorPresets() {
  const wrap = document.getElementById('colorPresets');
  wrap.innerHTML = MEMO_COLORS.map(c =>
    '<button class="color-preset' + (c === memoColor ? ' selected' : '') + '" style="background:' + c + ';" onclick="selectColor(\'' + c + '\')"></button>'
  ).join('');
}
function selectColor(c) { memoColor = c; initColorPresets(); }

/* ===== WORK LOG ===== */
function renderWorkLogs() {
  const list = document.getElementById('wlList');
  if (!workLogs.length) { list.innerHTML = '<div class="empty-msg">まだ記録がありません。<br>「＋ 記録」から追加してください。</div>'; return; }
  const sorted = [...workLogs].sort((a, b) => b.id - a.id);
  let h = '';
  sorted.forEach(wl => {
    const dateLabel = wl.date ? (() => { const p = wl.date.split('-'); return parseInt(p[1]) + '/' + parseInt(p[2]); })() : '';
    h += '<div class="wl-item"><div class="wl-head"><span class="wl-datetime">📅 ' + esc(dateLabel) + (wl.time ? ' ' + esc(wl.time) : '') + '</span>';
    h += '<div class="wl-actions"><button class="wl-btn" onclick="editWorklog(\'' + wl.id + '\')">✎</button>';
    h += '<button class="wl-btn" onclick="deleteWorklog(\'' + wl.id + '\')">×</button></div></div>';
    h += '<div class="wl-content">' + esc(wl.content) + '</div>';
    if (wl.notes) h += '<div class="wl-notes">📝 ' + esc(wl.notes) + '</div>';
    h += '</div>';
  });
  list.innerHTML = h;
}

function showWlForm(wl) {
  document.getElementById('wf_date').value = wl ? wl.date : todayStr();
  document.getElementById('wf_time').value = wl ? wl.time : nowTimeStr();
  document.getElementById('wf_content').value = wl ? wl.content : '';
  document.getElementById('wf_notes').value = wl ? (wl.notes || '') : '';
  editWlId = wl ? wl.id : null;
  document.getElementById('wlForm').classList.add('open');
  setTimeout(() => { document.getElementById('wf_content')?.focus(); }, 30);
}
function hideWlForm() { document.getElementById('wlForm').classList.remove('open'); editWlId = null; }
function saveWorklog() {
  const date = document.getElementById('wf_date').value;
  const time = document.getElementById('wf_time').value;
  const content = document.getElementById('wf_content').value.trim();
  const notes = document.getElementById('wf_notes').value.trim();
  if (!content) { toast('作業内容を入力してください'); return; }
  if (editWlId != null) { workLogs = workLogs.map(w => String(w.id) !== String(editWlId) ? w : { ...w, date, time, content, notes, updatedAt: nowFull() }); }
  else { workLogs.push({ id: Date.now(), date, time, content, notes, createdAt: nowFull() }); }
  save(); hideWlForm(); renderWorkLogs();
}
function editWorklog(id) { const wl = workLogs.find(w => String(w.id) === String(id)); if (wl) showWlForm(wl); }
function deleteWorklog(id) {
  if (!confirm('この記録を削除しますか？')) return;
  workLogs = workLogs.filter(w => String(w.id) !== String(id)); save(); renderWorkLogs();
}

/* ===== EXPORT / IMPORT ===== */
function exportJSON() {
  const data = { version: '1.0', exportedAt: nowFull(), items, memos, workLogs };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json;charset=utf-8;' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'タスクマネージャー_' + todayStr() + '.json'; a.click();
  URL.revokeObjectURL(a.href);
  toast('JSONを保存しました');
}
function exportCSV() {
  const BOM = '﻿';
  const header = 'タスク,優先度,期限,依頼者,担当,状態,作成日,完了日';
  const rows = items.map(it =>
    [it.content, PRI_LABEL[it.priority||'mid'], it.due||'', it.requester||'', it.assignee||'',
     it.done ? '完了' : '未完了', it.createdAt||'', it.doneAt||'']
    .map(v => '"' + String(v).replace(/"/g,'""') + '"').join(',')
  );
  const blob = new Blob([BOM + header + '\n' + rows.join('\n')], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'タスク一覧_' + todayStr() + '.csv'; a.click();
  URL.revokeObjectURL(a.href);
  toast('CSVを保存しました');
}
function importJSON(input) {
  const file = input.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (data.items) items = data.items;
      if (data.memos) memos = data.memos;
      if (data.workLogs) workLogs = data.workLogs;
      save(); renderTasks(); renderMemos(); renderWorkLogs(); updateStats();
      toast('データを復元しました');
    } catch { toast('JSONの読み込みに失敗しました'); }
  };
  reader.readAsText(file);
  input.value = '';
}

/* ===== STATS ===== */
function updateStats() {
  const el = id => document.getElementById(id);
  el('statTasks').textContent = items.length;
  el('statLogs').textContent = workLogs.length;
  el('statMemos').textContent = memos.length;
}

/* ===== CLEAR ALL ===== */
function clearAll() {
  if (!confirm('全データを削除します。この操作は元に戻せません。\n\n本当に削除しますか？')) return;
  items = []; workLogs = []; memos = [];
  save(); renderTasks(); renderMemos(); renderWorkLogs(); updateStats();
  toast('全データを削除しました');
}

/* ===== INIT ===== */
document.getElementById('dateLabel').textContent = (() => {
  const d = new Date(), w = ['日','月','火','水','木','金','土'][d.getDay()];
  return (d.getMonth()+1) + '/' + d.getDate() + '（' + w + '）';
})();
initColorPresets();
renderTasks();
renderMemos();
renderWorkLogs();
</script>
</body>
